# Runs .github/benchmark/run_checks.sh (also usable on a laptop with Docker)
name: Benchmark checks

on:
  pull_request:
    paths:
      - 'syntheticDataGIS/**'
      - '.github/benchmark/**'
      - '.github/workflows/benchmark.yml'
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * 1'

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout the code
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Pull the images
        run: |
          docker pull --platform linux/amd64 ohdsi/gaia-db:main
          docker pull --platform linux/amd64 ohdsi/gaia-core:main
          docker image ls --format '{{.Repository}}:{{.Tag}} {{.ID}} {{.Size}}' | grep ohdsi/ | tee image-versions.txt

      - name: Run the benchmark checks
        run: .github/benchmark/run_checks.sh

      - name: Upload the outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-checks
          path: |
            syntheticDataGIS/benchmark/output/ci/
            image-versions.txt
